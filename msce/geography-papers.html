<!DOCTYPE html>
<html>
<head>
  <title>Geography Papers</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<h1>Geography Past Papers</h1>

<div id="fileList"></div>

<script>
const files = [
  {name: "2024 April Paper", file: "papers/geography/2024-april.pdf", year: 2024},
  {name: "2023 November Paper", file: "papers/geography/2023-nov.pdf", year: 2023},
  {name: "2022 April Paper", file: "papers/geography/2022-april.pdf", year: 2022},
  {name: "2018 November Paper", file: "papers/geography/2018-nov.pdf", year: 2018}
];

function loadFiles() {
  let container = document.getElementById("fileList");

  files.forEach(f => {
    container.innerHTML += `
      <div class="card">
        <h3>${f.name}</h3>
        <a href="${f.file}" target="_blank">Open / Download</a>
      </div>
    `;
  });
}

loadFiles();
</script>

</body>
</html>
